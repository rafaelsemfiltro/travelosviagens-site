<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | TravelOS Viagens</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/fraunces-latin-wght-normal.woff2) format('woff2');}
  @font-face{font-family:'Fraunces';font-style:italic;font-weight:100 900;font-display:swap;src:url(/fonts/fraunces-latin-wght-italic.woff2) format('woff2');}
  @font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/manrope-latin-wght-normal.woff2) format('woff2');}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2');}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2');}


  :root{
    --ink:#0b1220;
    --ink-soft:#4a5468;
    --paper:#fffdf8;
    --sand:#f3ecdd;
    --sand-deep:#eadfc7;
    --card:#ffffff;
    --blue:#1456e6;
    --blue-deep:#0a3aa8;
    --turquoise:#0ea9a0;
    --turq-ink:#08766f;
    --coral:#ff6a45;
    --line:rgba(11,18,32,.13);
    --line-soft:rgba(11,18,32,.08);
    --shadow:0 20px 45px -25px rgba(11,18,32,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f7; --ink-soft:#a9b2c4; --paper:#080d17; --sand:#111a2c; --sand-deep:#0d1524;
      --card:#101a2c; --blue:#5b8bff; --blue-deep:#8fb0ff; --turquoise:#2dd4c8; --turq-ink:#2dd4c8; --coral:#ff8562;
      --line:rgba(238,241,247,.14); --line-soft:rgba(238,241,247,.08); --shadow:0 20px 45px -25px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef1f7; --ink-soft:#a9b2c4; --paper:#080d17; --sand:#111a2c; --sand-deep:#0d1524;
    --card:#101a2c; --blue:#5b8bff; --blue-deep:#8fb0ff; --turquoise:#2dd4c8; --turq-ink:#2dd4c8; --coral:#ff8562;
    --line:rgba(238,241,247,.14); --line-soft:rgba(238,241,247,.08); --shadow:0 20px 45px -25px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  a{color:inherit;}
  .wrap{max-width:1160px;margin-inline:auto;padding-inline:24px;}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;text-wrap:balance;margin:0;}
  .eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  p{color:var(--ink-soft);line-height:1.6;margin:0;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:'Manrope',sans-serif;font-weight:700;font-size:.95rem;padding:13px 22px;border-radius:999px;border:1px solid transparent;text-decoration:none;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;white-space:nowrap;}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px;}
  .btn-primary{background:var(--blue);color:#fff;box-shadow:0 12px 24px -12px rgba(20,86,230,.55);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 28px -12px rgba(20,86,230,.6);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
  .btn-sm{padding:9px 16px;font-size:.82rem;border-radius:999px;}

  header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);}
  .nav-row{display:flex;align-items:center;justify-content:space-between;padding-block:14px;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;}
  .brand img{width:34px;height:34px;}
  .brand-text{font-family:'Manrope',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:-.01em;}
  .brand-text b{color:var(--blue);font-weight:800;}
  .nav-links{display:flex;gap:26px;align-items:center;list-style:none;margin:0;padding:0;}
  .nav-links a{text-decoration:none;font-size:.92rem;font-weight:600;color:var(--ink-soft);transition:color .15s;}
  .nav-links a:hover{color:var(--ink);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
  .lang-toggle a{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;letter-spacing:.06em;line-height:1;padding:7px 9px;border-radius:999px;text-decoration:none;color:var(--ink-soft);transition:background .15s,color .15s;}
  .lang-toggle a:hover{color:var(--ink);}
  .lang-toggle a[aria-current="page"]{background:var(--sand-deep);color:var(--ink);}
  @media (max-width:880px){.nav-links{display:none;}}

  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line-soft);background:
    radial-gradient(1100px 560px at 82% -10%, color-mix(in srgb, var(--turquoise) 20%, transparent), transparent 60%),
    radial-gradient(900px 500px at -5% 10%, color-mix(in srgb, var(--blue) 16%, transparent), transparent 55%);
  }
  .hero-sea{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .hero-sea img{width:100%;height:100%;object-fit:cover;object-position:center;opacity:.5;filter:saturate(1.05);}
  .hero-sea::after{content:'';position:absolute;inset:0;background:
    linear-gradient(180deg, transparent 0%, transparent 42%, var(--paper) 86%),
    linear-gradient(96deg, var(--paper) 0%, var(--paper) 10%, color-mix(in srgb, var(--paper) 60%, transparent) 32%, transparent 60%);
  }
  .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:start;padding-block:48px 56px;}
  @media (max-width:920px){
    .hero-grid{grid-template-columns:1fr;padding-block:40px;}
    .hero-sea img{opacity:.32;}
    .hero-sea::after{background:
      linear-gradient(180deg, color-mix(in srgb, var(--paper) 55%, transparent) 0%, transparent 30%, transparent 55%, var(--paper) 90%);
    }
  }
  .hero h1{font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.06;letter-spacing:-.01em;margin-block:16px 18px;}
  .hero h1 em{font-style:italic;color:var(--blue);}
  .hero p.lead{font-size:1.08rem;max-width:52ch;}
  .hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;}
  .chip{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--turquoise);flex-shrink:0;}

  .route-art{position:relative;aspect-ratio:1/1;max-width:100%;width:min(680px,100%);margin-inline:auto;}
  .route-art svg{width:100%;height:100%;overflow:visible;}
  @media (prefers-reduced-motion:no-preference){.route-dash{stroke-dasharray:9 10;animation:dashmove 22s linear infinite;}}
  @keyframes dashmove{to{stroke-dashoffset:-400;}}

  section{padding-block:76px;}
  .section-head{max-width:640px;margin-bottom:44px;}
  .section-head .eyebrow{margin-bottom:10px;display:block;}
  .section-head h2{font-size:clamp(1.6rem,3vw,2.3rem);}
  .section-head p{margin-top:12px;font-size:1.02rem;}
  .band-sand{background:var(--sand);border-block:1px solid var(--line-soft);}

  .trust-bar{display:flex;flex-wrap:wrap;gap:28px 40px;align-items:center;justify-content:center;padding-block:20px;}
  .trust-item{display:flex;align-items:center;gap:9px;font-size:.86rem;font-weight:600;color:var(--ink-soft);}
  .trust-item .mono{color:var(--blue);}

  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  @media (max-width:920px){.grid-4{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.grid-4{grid-template-columns:1fr;}}
  .value-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px;}
  .value-card .num{font-family:'IBM Plex Mono',monospace;color:var(--blue);font-size:.78rem;font-weight:600;}
  .value-card h3{font-family:'Manrope',sans-serif;font-size:1.02rem;font-weight:800;}
  .value-card p{font-size:.92rem;}

  .about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:52px;align-items:start;}
  @media (max-width:880px){.about-grid{grid-template-columns:1fr;}}
  .about-photo{display:block;width:100%;height:auto;margin-top:26px;border-radius:20px;box-shadow:var(--shadow);}
  .about-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);}
  .about-card .mono{color:var(--turq-ink);font-size:.74rem;display:block;margin-bottom:6px;}
  .about-card h3{font-size:1.2rem;margin-bottom:6px;}
  .about-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .about-list li{display:flex;gap:10px;font-size:.9rem;color:var(--ink-soft);align-items:flex-start;}
  .about-list li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--coral);margin-top:7px;flex-shrink:0;}

  .fronts-tabs{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap;}
  .tab-btn{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink-soft);}
  .tab-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .tickets{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  @media (max-width:1100px){.tickets{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:920px){.tickets{grid-template-columns:1fr;}}
  .ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .ticket-photo{position:relative;height:150px;overflow:hidden;background:var(--sand);}
  .ticket-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .ticket-top{padding:18px 22px 14px;border-bottom:1px dashed var(--line);position:relative;}
  .ticket-top::before,.ticket-top::after{content:'';position:absolute;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--paper);}
  .ticket-top::before{left:-9px;} .ticket-top::after{right:-9px;}
  .ticket-tier{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;}
  .ticket-top h3{font-size:1.25rem;}
  .ticket-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px;flex:1;}
  .ticket-body p{font-size:.9rem;}
  .ticket-feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .ticket-feats li{font-size:.84rem;color:var(--ink-soft);display:flex;gap:8px;}
  .ticket-feats li::before{content:'✓';color:var(--turquoise);font-weight:700;flex-shrink:0;}
  .ticket-photo-tag{position:absolute;right:10px;bottom:10px;background:rgba(8,18,32,.78);color:#fff;font-size:.68rem;font-weight:600;padding:4px 9px;border-radius:6px;}
  .ticket-top h3{font-size:1.45rem;letter-spacing:-.01em;}
  .ticket-tagline{margin:4px 0 0;color:var(--blue);font-size:.95rem;font-weight:500;}
  .ticket-meta{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);}
  .tm-main{font-weight:700;font-size:1rem;color:var(--ink);}
  .tm-date{font-weight:700;font-size:.92rem;color:var(--ink);display:flex;flex-direction:column;}
  .tm-origin{font-size:.84rem;color:var(--ink-soft);}
  .ticket-incl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .ticket-incl li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--ink);line-height:1.35;}
  .ticket-incl svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px;}
  .ticket-price-box{margin-top:auto;border-radius:12px;}
  .ticket-price-box.has-value{background:var(--blue);color:#fff;display:flex;flex-direction:column;gap:8px;padding:14px 16px;box-shadow:0 8px 20px -10px rgba(20,86,230,.55);}
  .tpb-left{display:flex;flex-direction:column;}
  .ticket-price-box.has-value .tpb-eyebrow{font-size:.74rem;opacity:.9;}
  .ticket-price-box.has-value .tpb-value{font-family:'Manrope',sans-serif;font-weight:800;font-size:1.9rem;line-height:1.05;letter-spacing:-.02em;white-space:nowrap;}
  .tpb-right{display:flex;flex-direction:column;gap:1px;border-top:1px solid rgba(255,255,255,.35);padding-top:8px;font-size:.78rem;font-weight:700;line-height:1.3;}
  .ticket-price-box.tbd{background:transparent;border:1px dashed var(--line);padding:12px 16px;}
  .ticket-price-box.tbd .tpb-value{font-family:'IBM Plex Mono',monospace;font-size:.86rem;color:var(--ink-soft);}
  .tpb-note{font-size:.74rem;color:var(--ink-soft);margin:-6px 0 0;line-height:1.4;}
  .tpb-note a{color:inherit;text-underline-offset:2px;}
  .ticket-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:820px){.steps{grid-template-columns:1fr;}}
  .step{padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--card);}
  .step .mono{color:var(--blue);font-size:1.6rem;font-weight:600;}
  .step h3{font-size:1rem;margin:10px 0 6px;}
  .step p{font-size:.88rem;}

  .excursion-list{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:980px){.excursion-list{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:700px){.excursion-list{grid-template-columns:repeat(2,1fr);gap:10px;}}
  .excursion{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;transition:transform .15s ease, box-shadow .15s ease;}
  .excursion:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
  .excursion-photo{aspect-ratio:4/3;overflow:hidden;background:var(--sand-deep);position:relative;}
  .excursion-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .excursion-body{display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px;}
  .excursion h3{font-family:'Manrope',sans-serif;font-size:.84rem;font-weight:800;margin:0;line-height:1.25;}
  .excursion p{font-size:.74rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .excursion .tag{position:absolute;top:8px;left:8px;font-family:'IBM Plex Mono',monospace;font-size:.6rem;font-weight:600;letter-spacing:.04em;color:#fff;background:rgba(8,13,23,.7);padding:4px 9px;border-radius:999px;white-space:nowrap;}

  .groups-intro{max-width:64ch;margin-bottom:24px;font-size:.95rem;}
  .groups-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:920px){.groups-grid{grid-template-columns:1fr;}}
  .group-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:100%;}
  .group-badge{align-self:flex-start;font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--sand-deep);color:var(--ink-soft);}
  .group-card h3{font-size:1.12rem;margin-top:2px;}
  .group-card p{font-size:.88rem;}
  .group-meta{display:flex;flex-direction:column;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--ink-soft);margin-top:auto;padding-top:12px;border-top:1px solid var(--line-soft);}
  .groups-cta{margin-top:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .groups-cta p{font-size:.86rem;margin:0;}

  .dest-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:980px){.dest-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.dest-grid{grid-template-columns:1fr;}}
  .dest-card{border-radius:16px;border:1px solid var(--line);background:var(--card);overflow:hidden;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;text-align:left;padding:0;font:inherit;color:inherit;}
  .dest-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .dest-art{aspect-ratio:16/10;background:var(--sand-deep);position:relative;overflow:hidden;}
  .dest-art svg,.dest-art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease;}
  .dest-card:hover .dest-art img{transform:scale(1.04);}
  .dest-info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;}
  .dest-info .coord{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--blue);}
  .dest-info h3{font-family:'Manrope',sans-serif;font-size:1rem;font-weight:800;}
  .dest-info p{font-size:.83rem;}
  .dest-info .see-more{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--turq-ink);margin-top:4px;}

  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(8,13,23,.86);display:none;align-items:center;justify-content:center;padding:24px;}
  .lightbox.open{display:flex;}
  .lightbox-panel{background:var(--paper);border-radius:20px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:26px;}
  .lightbox-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;}
  .lightbox-head h3{font-size:1.3rem;}
  .lightbox-close{border:1px solid var(--line);background:var(--card);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:1.1rem;flex-shrink:0;color:var(--ink-soft);}
  .lightbox-gallery{display:block;}
  .lightbox-gallery img{width:100%;height:auto;border-radius:14px;display:block;aspect-ratio:16/10;object-fit:cover;}
  .lightbox-note{margin-top:16px;font-size:.82rem;padding:12px 14px;border-radius:12px;background:var(--sand);border:1px solid var(--line-soft);}

  .quote-wrap{display:flex;gap:32px;align-items:center;}
  @media (max-width:780px){.quote-wrap{flex-direction:column;align-items:flex-start;}}
  .quote-mark{font-family:'Fraunces',serif;font-size:5rem;line-height:1;color:var(--turquoise);flex-shrink:0;}
  blockquote{margin:0;font-family:'Fraunces',serif;font-size:clamp(1.3rem,2.6vw,1.9rem);font-style:italic;line-height:1.35;}
  blockquote::after{content:'\201D';color:var(--turquoise);font-style:normal;}
  .quote-attr{margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--ink-soft);}

  .final-cta{border-radius:24px;padding:46px 40px;background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;}
  .final-cta h2{color:#fff;font-size:clamp(1.5rem,3vw,2.1rem);}
  .final-cta p{color:rgba(255,255,255,.82);margin-top:8px;max-width:44ch;}
  .final-cta .btn-primary{background:#fff;color:var(--blue-deep);box-shadow:none;}
  .final-cta .btn-primary:hover{transform:translateY(-2px);}

  footer{border-top:1px solid var(--line-soft);padding-block:44px;background:var(--sand);}
  .foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:36px;}
  @media (max-width:780px){.foot-grid{grid-template-columns:1fr;gap:28px;}}
  .foot-brand{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .foot-brand img{width:28px;height:28px;}
  .foot-seal{display:inline-block;margin-top:16px;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s;}
  .foot-seal:hover{transform:translateY(-2px);}
  .foot-seal img{display:block;width:200px;height:auto;}
  footer .foot-h{font-family:'IBM Plex Mono',monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);margin:0 0 14px;}
